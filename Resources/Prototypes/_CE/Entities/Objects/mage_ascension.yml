- type: entity
  abstract: true
  name: grimoire
  parent: BookBase
  id: BaseMageGrimoire
  description: A bound spellbook. Use in hand to open or close it; an open grimoire can channel ley confluences.
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    sprite: _Funkystation/Structures/Mage/book.rsi
    layers:
    - state: icon
      map: [ "book" ]
  - type: Item
    size: Small
    sprite: _Funkystation/Structures/Mage/book.rsi
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.GrimoireBookVisuals.State:
        book:
          Closed: { state: icon }
          Opening: { state: icon_opening }
          Open: { state: icon-on }
          Closing: { state: icon_closing }
  - type: MageGrimoire
  - type: Tag
    tags:
    - Book

- type: entity
  name: ley confluence
  description: A knot of ambient mana. Mages sense it long before anyone else notices.
  parent: BaseItem
  id: MageLeyConfluence
  categories: [ ForkFiltered ]
  components:
  - type: Transform
    anchored: true
  - type: Anchorable
  - type: Sprite
    sprite: _Funkystation/Structures/Mage/reality_fracture.rsi
    layers:
    - state: icon
      map: [ "ley" ]
    noRot: true
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ConfluenceVisuals.LeyLine:
        ley:
          Dormant: { state: icon }
          Harvested: { state: icon_harvested }
  - type: Confluence
  - type: LeyLineSource
    enabled: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.35,0.35,0.35"
        density: 20
        mask:
        - ItemMask
        layer:
        - LowImpassable
  - type: CollisionWake
  - type: ConfluenceResearchHarvest
    pointsRemaining: 0
  - type: Physics
    bodyType: Static
    canCollide: false

- type: entity
  name: mana mote
  id: MageManaMote
  categories: [ ForkFiltered ]
  save: false
  components:
  - type: Sprite
    sprite: _CE/Effects/cast_impact48.rsi
    state: particles_up
    shader: unshaded
    color: "#aaccff"
    noRot: true
  - type: MageManaMote
  - type: TimedDespawn
    lifetime: 12
  - type: PointLight
    radius: 1.2
    energy: 2
    color: "#aaccff"
  - type: Physics
    bodyType: KinematicController
    canCollide: false

- type: entity
  parent: ClothingHandsBase
  id: ClothingHandsGlovesLeadMage
  name: lead-lined gauntlets
  description: Heavy gloves that bleed off arcane charge. A brig access chip is required to remove them from a suspect.
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    sprite: Clothing/Hands/Gloves/Color/color.rsi
    state: icon
    color: "#555555"
  - type: Clothing
    quickEquip: true
  - type: Fiber
    fiberMaterial: fibers-insulative
  - type: FingerprintMask
  - type: LeadGauntlets
  - type: AccessReader
    access: [["Brig"]]

- type: startingGear
  id: MageOfAscensionGearBase
  storage: {}

- type: entity
  name: dimensional rift
  description: A wound in local reality. With enough leverage, you could peel it wide enough to slip home—and something else is already leaning on the other side.
  parent: BaseItem
  id: MageDimensionalRift
  categories: [ ForkFiltered ]
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: /Textures/Effects/portal.rsi
    layers:
    - state: portal-red
    shader: unshaded
    noRot: true
  - type: PointLight
    color: OrangeRed
    radius: 3.5
    energy: 1.4
    netsync: false
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.45,0.35,0.45"
        density: 50
        mask:
        - FullTileMask
        layer:
        - LowImpassable
  - type: Physics
    bodyType: Static
  - type: MageDimensionalRift
    pryDuration: 36
  - type: MageStationDimensionalRift
