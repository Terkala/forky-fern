# Forky — wizard antag spell progression (skill tree + WizCoin-equivalent costs).
# Path commits cost 1 point and lock the other schools; spells use store listing costs.

- type: skillPoint
  id: WizardArcane
  name: forkyloc-wizard-arcane-point-name
  icon:
    sprite: _CE/Interface/Misc/skill_point.rsi
    state: elf

- type: skillTree
  id: ForkyWizardTreeOffensive
  name: forkyloc-wizard-tree-offensive-name
  desc: forkyloc-wizard-tree-offensive-desc
  skillType: WizardArcane
  color: "#a32828"
  parallax: Default

- type: skillTree
  id: ForkyWizardTreeDefensive
  name: forkyloc-wizard-tree-defensive-name
