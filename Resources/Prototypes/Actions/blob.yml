# Blob antagonist actions

- type: entity
  parent: BaseMentalAction
  id: ActionBlobDeploy
  name: action-name-blob-deploy
  description: action-desc-blob-deploy
  components:
  - type: Action
    icon:
      sprite: Objects/Magic/magicactions.rsi
      state: spell_default
    itemIconStyle: NoItem
  - type: TargetAction
    checkCanAccess: false
    range: -1
  - type: WorldTargetAction
    event: !type:BlobDeployActionEvent

