- type: entity
  id: BaseBlobTile
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: Objects/Misc/kudzu.rsi
    drawdepth: FloorObjects
    layers:
    - state: kudzu_11
  - type: BlobTile
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/Effects/Footsteps/slime2.ogg
  - type: Damageable
    damageModifierSet: Blob
  - type: Clickable
  - type: Temperature
  - type: TemperatureDamage
    heatDamage:
      types:
        Heat: 3
  - type: UserInterface
    interfaces:
      enum.BlobTileSwapUiKey.Key:
        type: BlobTileSwapBoundUserInterface

- type: entity
  parent: BaseBlobTile
  id: MobBlobTile
  categories: [ HideSpawnMenu ]
  components:
  - type: BlobTile
    kind: Normal
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
