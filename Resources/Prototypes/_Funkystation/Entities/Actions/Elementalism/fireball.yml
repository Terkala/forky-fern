# Elementalism L5 — Fireball (wizard-parity projectile + timed flight cap).

- type: entity
  id: CEProjectileElementalMageFireball
  parent: ProjectileFireball
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 5

- type: entity
  id: CEActionSpellElementalFireball
  parent: CEActionSpellBase
  name: Fireball
  description: Launches an explosive sphere of flame toward the targeted location.
  components:
  - type: CEActionManaCost
    manaCost: 45
  - type: CEActionFreeHandsRequired
  - type: CEActionDoAfterVisuals
    proto: CERuneElementalFireball
  - type: Action
    useDelay: 15
    icon:
      sprite: Objects/Magic/magicactions.rsi
      state: fireball
  - type: DoAfterArgs
    delay: 0.5
  - type: TargetAction
    range: 40
  - type: WorldTargetAction
    event: !type:CEWorldTargetModularEffectEvent
      effects:
      - !type:CESpellProjectile
        prototype: CEProjectileElementalMageFireball
        projectileSpeed: 12

- type: entity
  id: CERuneElementalFireball
  parent: CEBaseMagicRune
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: PointLight
    color: "#E25822"
  - type: Sprite
    layers:
    - state: medium_line
      color: "#E25822"
