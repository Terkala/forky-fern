# --- Path roots (1 pt each; mutually exclusive) ---

- type: skill
  id: ForkyWizardCommitOffensive
  name: forkyloc-wizard-commit-offensive-name
  desc: forkyloc-wizard-commit-offensive-desc
  skillUiPosition: 0, 0
  learnCost: 1
  tree: ForkyWizardTreeOffensive
  icon:
    sprite: Objects/Magic/magicactions.rsi
    state: fireball
  restrictions:
  - !type:BlockIfAnySkillLearned
    blockedIfAnyLearned:
    - ForkyWizardCommitDefensive
    - ForkyWizardCommitUtility
