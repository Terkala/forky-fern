# Funky Station — school-picker UI + starting grimoire (extends CE BaseMageGrimoire / MageOfAscensionGearBase).

- type: entity
  parent: BaseMageGrimoire
  id: MageGrimoire
  components:
  - type: UserInterface
    interfaces:
      enum.GrimoireSchoolPickerUiKey.Key:
        type: GrimoireSchoolPickerBoundUserInterface
  - type: ActivatableUI
    key: enum.GrimoireSchoolPickerUiKey.Key
    inHandsOnly: true

- type: startingGear
  id: MageOfAscensionGear
  parent: MageOfAscensionGearBase
  equipment:
    pocket2: MageGrimoire
