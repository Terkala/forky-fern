# Funky Station — CE skill tree UI + starting grimoire (extends CE BaseMageGrimoire / MageOfAscensionGearBase).

- type: entity
  parent: BaseMageGrimoire
  id: MageGrimoire
  components:
  - type: UserInterface
    interfaces:
      enum.GrimoireSkillTreeUiKey.Key:
        type: GrimoireSkillTreeBoundUserInterface
  - type: ActivatableUI
    key: enum.GrimoireSkillTreeUiKey.Key
    inHandsOnly: true

- type: startingGear
  id: MageOfAscensionGear
  parent: MageOfAscensionGearBase
  equipment:
    pocket2: MageGrimoire
