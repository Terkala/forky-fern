# Ray attacks for mage-summoned Behonkers (BehonkerRaySystem).

- type: entity
  parent: BaseAction
  id: ActionHonkBehonkerRayFire
  name: funky-mage-behonker-ray-fire-name
  description: funky-mage-behonker-ray-fire-desc
  components:
  - type: Action
    raiseOnUser: true
    useDelay: 6
    icon:
      sprite: Objects/Magic/magicactions.rsi
      state: fireball
    sound:
      path: /Audio/Weapons/Guns/Gunshots/laser.ogg
      params:
        volume: -6
  - type: TargetAction
    range: 12
  - type: WorldTargetAction
    event: !type:BehonkerRayActionEvent
      range: 12
      damage:
        types:
          Heat: 18

